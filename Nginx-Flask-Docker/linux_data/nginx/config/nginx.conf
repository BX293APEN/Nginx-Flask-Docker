# This file path : /${ENTRY_DIR}/${WS}/nginx/config/nginx.conf

# nginx -p "/${ENTRY_DIR}/${WS}/nginx" -c "/${ENTRY_DIR}/${WS}/nginx/config/nginx.conf"

worker_processes auto;
pid run/nginx.pid;
error_log  run/error.log;

events {
    worker_connections 1024;
}

http {
    access_log run/access.log;
    client_body_temp_path run/tmp/client_body;
    proxy_temp_path       run/tmp/proxy;
    fastcgi_temp_path     run/tmp/fastcgi;
    uwsgi_temp_path       run/tmp/uwsgi;
    scgi_temp_path        run/tmp/scgi;

    # 拡張子からContent-Typeを判別するための定義(システム標準のものを利用)
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    server {
        # コンテナ内の待受ポート (ホストの ${PORT} → ここ にマッピングされる)
        listen      3000;
        server_name _;

        # | location | 処理 | 備考 |
        # | --- | --- | --- |
        # | /static/ | nginxが html/static を直接配信 | CSS / JS / 画像用 |
        # | / (上記以外すべて) | Flask(gunicorn)へ中継 | ページ・APIはすべてFlaskが返す |
        #
        # html/flask (Flaskのソース) はnginxから配信されない (どのlocationにも該当しない)

        root html;

        location /static/ {
            try_files $uri =404;
        }

        # 127.0.0.1:5000 は .env の FLASK_PORT と合わせること
        location / {
            proxy_pass http://127.0.0.1:5000;

            # 元のクライアント情報をFlaskへ伝える
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
